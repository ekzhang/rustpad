[package]
name = "rustpad-server"
version = "0.1.0"
authors = ["Eric Zhang <ekzhang1@gmail.com>"]
edition = "2021"

[dependencies]
anyhow = "1.0.40"
bytecount = "0.6"
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures = "0.3.15"
log = "0.4.14"
operational-transform = { version = "0.6.0", features = ["serde"] }
parking_lot = "0.12.5"
pretty_env_logger = "0.5.0"
rand = "0.8.3"
serde = { version = "1.0.126", features = ["derive"] }
serde_json = "1.0.64"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "tls-rustls"] }
tokio = { version = "1.6.1", features = ["full", "test-util"] }
tokio-stream = "0.1.6"
warp = { version = "0.4.3", features = ["server", "websocket"] }

[dev-dependencies]
tempfile = "3.2.0"
warp = { version = "0.4.3", features = ["server", "test", "websocket"] }
